name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: package.json
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm build
      - run: pnpm tauri build --debug
  xray-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/Cargo.toml real_xray_socks_reconnects_when_verified_fixture_is_supplied -- --nocapture
        env:
          VOID_XRAY_INTEGRATION: "1"
      - run: cargo test --manifest-path src-tauri/Cargo.toml managed_xray_crash_is_detected_when_verified_fixture_is_supplied -- --nocapture
        env:
          VOID_XRAY_INTEGRATION: "1"
